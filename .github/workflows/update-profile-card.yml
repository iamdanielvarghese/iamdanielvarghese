name: Update Profile Card

on:
  schedule:
    - cron: '10 4 * * *'   # 04:10 UTC = 09:40 IST, daily
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch live GitHub stats
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: python3 fetch_stats.py

      - name: Regenerate profile card SVGs
        run: python3 generate_card.py

      - name: Commit changes if anything moved
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile card stats"
          file_pattern: "card-dark.svg card-light.svg card-dark-static.svg card-light-static.svg stats.json"
